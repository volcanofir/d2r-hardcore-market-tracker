name: Build HD rune sprite

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/build_rune_sprite.py'
      - '.github/workflows/build-runes.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build HD rune sprite
        run: python tools/build_rune_sprite.py
      - name: Commit HD sprite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/runes-hd.svg
          if git diff --cached --quiet; then
            echo "No sprite changes"
            exit 0
          fi
          git commit -m "Build HD rune sprite"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

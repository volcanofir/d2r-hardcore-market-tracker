name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_run:
    workflows: ['Update D2R market']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site/data _site/assets
          cp -R site/. _site/
          cp data/market.json _site/data/market.json
          cp data/history.json _site/data/history.json

          python3 - <<'PY'
          import base64
          from pathlib import Path

          parts = [
              Path('site/assets/runes-original-hd.webp.b64.00'),
              Path('site/assets/runes-original-hd.webp.b64.01'),
              Path('site/assets/runes-original-hd.webp.b64.02'),
          ]
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          data = base64.b64decode(encoded)
          if len(data) < 1000 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('Invalid rebuilt rune WebP asset')
          Path('_site/assets/runes-original-hd.webp').write_bytes(data)
          print(f'Rebuilt rune sprite: {len(data)} bytes')
          PY

          rm -f _site/assets/runes-original-hd.webp.b64.*
          sed -i 's#\.\./data/#./data/#g' _site/app.js
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

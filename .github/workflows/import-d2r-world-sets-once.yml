name: Import D2R World sets once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-d2r-world-sets-once.yml'
      - 'sync_d2r_world_sets.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: d2r-world-sets-one-time
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Import complete D2R World set catalog
        run: python sync_d2r_world_sets.py
      - name: Commit static set catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/d2r_world_sets.json data/catalog.json
          git commit -m "Import static D2R World set catalog"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1

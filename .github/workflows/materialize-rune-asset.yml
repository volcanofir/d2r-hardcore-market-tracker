name: Materialize Rune Asset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-rune-asset.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build real WebP asset
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          parts = [
              Path('site/assets/runes-original-hd.webp.b64.00'),
              Path('site/assets/runes-original-hd.webp.b64.01'),
              Path('site/assets/runes-original-hd.webp.b64.02'),
          ]
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          encoded += '=' * (-len(encoded) % 4)
          data = base64.b64decode(encoded)
          if len(data) < 1000 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('Invalid rune WebP asset')
          Path('site/assets/runes-original-hd.webp').write_bytes(data)
          print(f'Created site/assets/runes-original-hd.webp: {len(data)} bytes')
          PY
          file site/assets/runes-original-hd.webp

      - name: Commit real image file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/runes-original-hd.webp
          if git diff --cached --quiet; then
            echo "Asset already materialized"
            exit 0
          fi
          git commit -m "Add real HD rune sprite asset"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

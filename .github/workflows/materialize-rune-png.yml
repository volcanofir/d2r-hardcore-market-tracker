name: Materialize Complete Rune PNG

on:
  push:
    branches: [main]
    paths:
      - '.tmp/rune-part-00.bin'
      - '.tmp/rune-part-01.bin'
      - '.tmp/rune-part-02.bin'
      - '.github/workflows/materialize-rune-png.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and validate PNG
        run: |
          cat .tmp/rune-part-00.bin .tmp/rune-part-01.bin .tmp/rune-part-02.bin > site/assets/runes-original-hd.png
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/assets/runes-original-hd.png')
          d = p.read_bytes()
          assert len(d) == 31627, f'unexpected size: {len(d)}'
          assert d[:8] == b'\x89PNG\r\n\x1a\n', 'invalid PNG signature'
          assert d[-12:] == b'\x00\x00\x00\x00IEND\xaeB`\x82', 'invalid PNG ending'
          print(f'Valid rune PNG: {len(d)} bytes')
          PY
          file site/assets/runes-original-hd.png

      - name: Commit complete PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/runes-original-hd.png
          git commit -m "Add complete rune PNG sprite"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

# trigger 2026-08-23 complete binary rebuild

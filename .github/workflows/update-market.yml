name: Update D2R market

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scraper.py'
      - 'probe.py'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/update-market.yml'
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

concurrency:
  group: d2r-market-update
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe d2jsp connectivity
        run: python probe.py
      - name: Use HTTPS reader fallback
        run: |
          sed -i 's#https://r.jina.ai/http://#https://r.jina.ai/https://#g' scraper.py
          sed -i 's/links\[:200\]/links[:120]/' scraper.py
      - name: Scrape d2jsp market
        run: python scraper.py
      - name: Commit refreshed market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json data/history.json data/diagnostic.json
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi

          git commit -m "Update D2R market data"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done

          echo "Push failed after 3 attempts"
          exit 1

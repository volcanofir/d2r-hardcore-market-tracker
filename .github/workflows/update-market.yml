name: Update D2R market

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scraper_live.py'
      - 'season15_runner.py'
      - 'item_tracker.py'
      - 'sync_d2r_world_sets.py'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/update-market.yml'
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

concurrency:
  group: d2r-market-update
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Import D2R World set catalog once
        if: github.event_name == 'push' && github.event.head_commit.message == 'Run one-time D2R World set catalog import'
        run: python sync_d2r_world_sets.py
      - name: Scrape Season 15 rune market
        run: |
          sed -i 's/s.MAX_WORKERS = 4/s.MAX_WORKERS = 2/' season15_runner.py
          python season15_runner.py
          git checkout -- season15_runner.py
      - name: Scrape Season 15 equipment market
        run: python item_tracker.py
      - name: Commit refreshed market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json data/history.json data/diagnostic.json data/topic_cache.json data/item_topic_cache.json data/item_diagnostic.json data/d2r_world_sets.json data/catalog.json
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Update Season 15 D2R market data"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
